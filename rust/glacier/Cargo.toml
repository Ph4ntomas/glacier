[package]
name = "glacier"
version = "0.1.0"
edition = "2024"

[dependencies]
pinnacle-api = { git = "http://github.com/Ph4ntomas/pinnacle", branch = "next", default-features = false }
snowcap-api = { git = "http://github.com/Ph4ntomas/pinnacle", branch = "next", default-features = false }

tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "registry"] }

indexmap = "2.13.0"
regex = "1.12.2"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"]}
tokio-stream = "0.1.18"
chrono = { version = "0.4", features = [ "alloc" ] }
futures = "0.3.31"
xkbcommon = "0.9.0"
serde = { version = "1.0.228", features = ["derive"] }
zbus = { version = "5.12.0", default-features = false, features = ["tokio"] }

glacier-derive = { path = "../glacier-derive" }
